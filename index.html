    #root .rounded-2xl { border-radius:24px; }

    #root .bg-gradient-to-r.from-blue-300 { background:linear-gradient(115deg,#567ba2,#899fc6); }

    :root {--ink:#183b4a;--teal:#2c7180;--paper:#fffaf0;--cream:#f4ead5;--gold:#e5b85d;}
    body {background:var(--cream);color:var(--ink);}
    body::before {background:radial-gradient(ellipse at 0% 0%,#dfeceb 0%,transparent 50%),radial-gradient(ellipse at 100% 100%,#f4e2b9 0%,transparent 50%);}
    nav.bg-indigo-600 {background:linear-gradient(100deg,#183b4a,#2c7180);}
    #root .bg-white {background-color:#fffdf8;}
    #root button.bg-indigo-600 {background:var(--teal);}

    .pet-evolution strong {font-size:11px;margin-top:5px;}.pet-evolution small {font-size:10px;margin-top:4px;}
    #root .pet-evolution .unlocked {color:#2c7180;}.pet-evolution .unlocked .pet-evolution-dot {background:#4c8e90;color:white;}.pet-evolution .viewing .pet-evolution-dot {outline:2px solid #e5b85d;}

    .pet-collection {grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #ded3bd;background:#fffcf4;padding:20px 25px;gap:25px;}.pet-collection h3 {font-size:12px;font-weight:800;margin-bottom:12px;}.pet-badges {display:flex;gap:14px;}.pet-badges>div {display:flex;flex-direction:column;align-items:center;gap:5px;color:#93998b;}.pet-badges i {font-size:18px;display:flex;align-items:center;justify-content:center;border:1px solid #dbddcd;background:#efeee4;width:38px;height:38px;border-radius:50%;}.pet-badges .earned {color:#9a762f;}.pet-badges .earned i {border-color:#dfc888;background:#f4e7ba;}.pet-badges span {font-size:10px;}.pet-badge-rules,.pet-journal p {font-size:10px;color:#8d9484;margin-top:10px;}.pet-journal>div {display:flex;justify-content:space-between;border-bottom:1px dashed #e2dfce;padding:4px 0;font-size:11px;}.pet-journal time {color:#899183;}

    .pet-register {display:flex;align-items:end;gap:12px;margin-top:15px;}.pet-register label {display:block;font-size:12px;flex:1;}.pet-register input {width:100%;background:#fffdf8;border:1px solid #d7dacc;padding:8px 12px;margin-top:5px;min-width:0;}.pet-primary {background:#2c7180;color:#fffaf0;padding:11px 18px;border-radius:10px;font-size:12px;font-weight:700;white-space:nowrap;}.pet-error {color:#b05948;font-size:12px;margin-top:10px;}.pet-notice {padding:22px;background:#fffaf0;border:1px solid #ded3bd;border-radius:16px;font-size:13px;}.pet-notice p {margin:8px 0;color:#977351;}.pet-notice button {color:#2c7180;text-decoration:underline;margin-top:8px;}
    @media(max-width:700px) {#root .pet-home {grid-template-columns:1fr;}.pet-room {min-height:350px;border-right:0;border-bottom:1px solid #ded3bd;}.pet-character {height:235px!important;max-width:270px;left:calc(50% - 135px)!important;}.pet-details {padding:22px;}.pet-collection {grid-template-columns:1fr;gap:20px;}.pet-adoption {padding:18px;}.pet-adopt-grid {gap:8px;}.pet-choice {padding:8px;}.pet-choice.selected {padding:7px;}.pet-choice .pet-portrait {height:110px;}.pet-choice strong {font-size:12px;}.pet-choice>span {font-size:10px;}}


    .pet-room {background-image:url("assets/ffc6562441cf8c83.png");background-size:cover;background-position:center;}
    .pet-room-label {background:#fffaf0dd;border:1px solid #d5c5a5;border-radius:20px;padding:7px 12px;font-size:11px;box-shadow:0 3px 9px #183b4a10;}
